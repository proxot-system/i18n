discovery:
  description: |
    ![The World Machine Logo](https://media.discordapp.net/attachments/1025158501540036639/1049326772161888369/The_World_Machine_Logo.png?ex=69d072f6&is=69cf2176&hm=889524a31287fb9c1c4680ccce21cbb567270143f985e5a91383ef0614466a32&)

    💡 **Принесите мир OneShot'а на свой сервер!**
    Мировая Машина теперь бродит по интернету и может взаимодействовать с вами через Proxot. 

    👾 **Никоготчи (Виртуальные питомцы/Тамаготчи)**
    Приютите и заботьтесь о своих OneShot персонажах, размером с яблоко! Кормите, мойте и тискайте их. Прокачивайте их уровень и хвастайтесь им своим друзьям (купите капсулу в `/shop` и затем используйте `/nikogotchi check`)

    💬 **Собственные Текстбоксы**
    Создавайте любой диалог: используйте `/textbox create`, чтобы создать OneShot-подобное диалоговое окно, например как: ![Анимированное OneShot окно. Сперва, Мировая Машина с цветочком Proxot на шляпе говорит: "вау эта дискорд штуковина крутая и лапотрясная". Затем, Кип Сильверпоинт, нося крутые очки, отвечает: "это правда"](https://media.discordapp.net/attachments/1336864890706595852/1489148082032611338/TWM_textbox_2_1775110968.GIF?ex=69d0ae39&is=69cf5cb9&hm=5c6b73d7392540e9156b41a019821d285469dca047ece12a8c06955e1078c380&)

    📺 **Межсерверные Передачи**
    Схожие с userphone'ом Yggdrasil, эти передачи позволят вам созваниваться и переписываться с пользователями с совершенно других серверов (пропишите `/transmit connect` на обоих серверах)

    🪪 **Штампы Профиля**
    Покажите всем свою целеустремленность: зарабатывайте уникальные штампы вашему Proxot профилю через прохождение различных этапов, чтобы потом ими можно было хвастаться
